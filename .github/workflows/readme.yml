name: Update README with GitHub Pages URL

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - development
  workflow_dispatch:

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Replace placeholder with GitHub Pages URL
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          GITHUB_PAGES_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/"
          sed -i "s|{{GITHUB_PAGES_URL}}|$GITHUB_PAGES_URL|g" README.md

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "readme: update README with github pages URL."
          git push
