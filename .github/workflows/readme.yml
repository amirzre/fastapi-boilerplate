name: Update README with Documentation Link

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - development

  workflow_run:
    workflows: ["Deploy Docs"]
    types:
      - completed

jobs:
  update-readme:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Update README with correct documentation URL
        run: |
          # Get repository details
          REPO_OWNER="${GITHUB_REPOSITORY_OWNER}"
          REPO_NAME="${GITHUB_REPOSITORY#*/}"

          # Define the documentation URL
          DOCS_URL="https://${REPO_OWNER}.github.io/${REPO_NAME}"

          # Update the README - this assumes you have a placeholder or can identify where to update
          # Using sed to replace a placeholder with the actual URL
          sed -i 's|<!-- DOCS-URL -->.*<!-- END-DOCS-URL -->|<!-- DOCS-URL -->[Documentation]('"${DOCS_URL}"')<!-- END-DOCS-URL -->|g' README.md

          # If the placeholder doesn't exist, you might need a different approach

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "readme: update README with github pages URL." || echo "No changes to commit."
          git push
