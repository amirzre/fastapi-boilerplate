name: Update README

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development
  workflow_run:
    workflows: ["Deploy Docs"]
    types:
      - completed

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref_name }}

      - name: Replace placeholder with GitHub Pages URL
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          GITHUB_PAGES_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/"
          sed -i "s|{{GITHUB_PAGES_URL}}|$GITHUB_PAGES_URL|g" README.md

      - name: Commit & push changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m "readme: update README with GitHub Pages URL."
            TARGET_BRANCH="$([[ "${{ github.event_name }}" == "workflow_run" ]] \
                              && echo "${{ github.event.workflow_run.head_branch }}" \
                              || echo "${{ github.ref_name }}")"
            git remote set-url origin \
              https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
            git push origin HEAD:"$TARGET_BRANCH"
          else
            echo "No changes to commit"
          fi
