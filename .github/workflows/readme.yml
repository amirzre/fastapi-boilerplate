name: Update README
on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development
  workflow_run:
    workflows: ["Deploy Docs"]
    types:
      - completed

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.ref }}
          
      - name: Replace placeholder with GitHub Pages URL
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          GITHUB_PAGES_URL="https://${GITHUB_REPOSITORY_OWNER}.github.io/${REPO_NAME}/"
          sed -i "s|{{GITHUB_PAGES_URL}}|$GITHUB_PAGES_URL|g" README.md
          
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "readme: update README with github pages URL."
          
          # Determine the correct branch name to push to
          if [[ "${{ github.event_name }}" == "workflow_run" ]]; then
            TARGET_BRANCH="${{ github.event.workflow_run.head_branch }}"
          else
            TARGET_BRANCH="${{ github.ref_name }}"
          fi
          
          git push origin HEAD:"$TARGET_BRANCH"
